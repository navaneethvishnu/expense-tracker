<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Expense Tracker</h1>
    <div class="status">
      <div class="total-balance slide">
        <div class="sign">
          <p>B</p>
        </div>
        <div class="value">
          <p>Total Balance</p>
          <h2 id="totalBalance">₹0</h2>
        </div>
      </div>
      <div class="total-income slide">
        <div class="sign">
          <p>I</p>
        </div>
        <div class="value">
          <p>Total Income</p>
          <h2 id="totalIncome">₹0</h2>
        </div>
      </div>
      <div class="total-expense slide">
        <div class="sign">
          <p>E</p>
        </div>
        <div class="value">
          <p>Total Expense</p>
          <h2 id="totalExpense">₹0</h2>
        </div>
      </div>
    </div>

    <div class="input">
      <h2>Add Transaction</h2>
      <div class="inputs">
        <div>
          <label for="transaction-name">Transaction Name</label>
          <input
            type="text"
            id="transaction-name"
            placeholder="e.g. Grocery, Salary"
          />
        </div>
        <div>
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="e.g. 1500" />
        </div>
        <div>
          <label for="type">Type</label>
          <select name="type" id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div class="submit-button">
          <button id="submitBtn">+ Add Transaction</button>
        </div>
      </div>
    </div>

    <div class="table">
      <h2>Transaction History</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Transaction Name</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="message" class="">Please enter a valid amount</div>
    <script src="script.js"></script>
  </body>
</html>
